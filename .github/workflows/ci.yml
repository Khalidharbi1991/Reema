name: Offline verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.12'}
          - {os: macos-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    env:
      ANTHROPIC_API_KEY: ''
      ALLOW_EXTERNAL_AI: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: PDF libraries on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 fonts-dejavu-core
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pytest --cov=src --cov-report=term --cov-report=xml
      - name: Required PDF smoke test
        if: runner.os == 'Linux'
        run: python -m scripts.verify_exports --output output/ci-smoke
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reema:test .
      - run: docker run --rm --network none reema:test status
      - name: No customer references or secrets in the image
        run: docker run --rm --network none --entrypoint python reema:test -c "from pathlib import Path; assert not Path('/app/.env').exists(); assert not list(Path('/app/references').rglob('*.*')); assert not Path('/app/.git').exists()"
      - name: Real export smoke in container
        run: docker run --rm --network none --entrypoint python -v "${{ github.workspace }}/scripts/verify_exports.py:/app/verify_exports.py:ro" reema:test /app/verify_exports.py --output /app/output/smoke
