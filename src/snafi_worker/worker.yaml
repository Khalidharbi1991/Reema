# Snafi worker settings. No secrets here: they live in Windows Credential Manager
# (stored once, as the worker Windows user, with: C:\SnafiWorker\snafi.cmd set-secrets).
# Each outside service is chosen by its provider name; switching one is a one-line change.

brain:
  provider: gemini_api          # Gemini API, paid tier funded by Khalid's AI Pro credits; key in Credential Manager
                                # others: agy (switched off: its search_web tool cannot be denied), fake (tests)
  model: gemini-3.5-flash-lite  # the fast Flash model for chat
  timeout_seconds: 60
  max_output_tokens: 1024

store:
  provider: supabase_rest       # or: memory (offline, for tests)
  timeout_seconds: 20

lanes:
  chat:
    poll_seconds: 2
    timeout_seconds: 120        # whole job, brain call (90 s) included
    retry_delay_seconds: 5      # one retry (jobs.max_attempts = 2)
  background:
    poll_seconds: 30
    timeout_seconds: 600
    retry_delay_seconds: 60

heartbeat:
  seconds: 15                   # the app shows "PC offline" after 45 seconds

backup:
  folder: D:/Projects/IT Consultant/teams/coordination/snafi-backups   # ignored by Git; no Claude session may read it
  time: "03:30"                 # daily, local time below
  keep_days: 30

time_zone: Asia/Riyadh
