# Snafi worker settings. No secrets here: they live in Windows Credential Manager
# (stored once, as Khalid, who the worker runs as, with: C:\SnafiWorker\snafi.cmd set-secrets).
# Each outside service is chosen by its provider name; switching one is a one-line change.

brain:
  provider: claude_api          # Claude API (Anthropic), text only, no tools; key in Credential Manager
                                # others: gemini_api (switched off; model gemini-3.5-flash-lite),
                                #         agy (switched off: its search_web tool cannot be denied), fake (tests)
  model: claude-haiku-5-5       # the cheapest current Haiku
  effort: low
  timeout_seconds: 60
  max_output_tokens: 1024
  daily_call_limit: 300         # brain calls per day, retries included (SEC-47); then Ahmad says so until tomorrow

store:
  provider: supabase_rest       # or: memory (offline, for tests)
  timeout_seconds: 20

lanes:
  chat:
    poll_seconds: 2
    timeout_seconds: 120        # whole job, brain call (60 s) included
    retry_delay_seconds: 5      # one retry (jobs.max_attempts = 2)
  background:
    poll_seconds: 30
    timeout_seconds: 600
    retry_delay_seconds: 60

# Step 3: Khalid's personal Google account. Each service is its own adapter; "none" switches it off,
# "fake" is for tests. Until Khalid runs `snafi.cmd connect-google`, the tools say "not connected"
# and the worker keeps running.
mail:
  provider: gmail               # scopes gmail.readonly + gmail.compose (drafts; sends only after Approve)
calendar:
  provider: google_calendar     # scope calendar.events (main calendar)
files:
  provider: google_drive        # scope drive.readonly
google:
  timeout_seconds: 20

# Step 4: Khalid's Yahoo Mail and Todoist, each its own adapter ("none" switches one off, "fake" is
# for tests). Their logins live only in Credential Manager (set-secrets); until stored, the tools
# say "not connected" and the worker keeps running.
yahoo:
  provider: yahoo_imap          # IMAP (imap.mail.yahoo.com) to read and save drafts; SMTP to send after Approve
  timeout_seconds: 30
tasks:
  provider: todoist             # Todoist API v1 (api.todoist.com) with Khalid's API token
  timeout_seconds: 20

today_feed:
  minutes: 10                   # next event, important unread mail (Gmail and Yahoo) and today's tasks (no brain call)

# Step 5: Proactive Ahmad. The scheduler runs in this worker (no Vercel cron, no brain call): reminders,
# the morning brief (its time is Khalid's, in the app's Settings), the mail watch and Web Push. Push needs
# SNAFI_VAPID_PRIVATE_KEY and SNAFI_PUSH_CONTACT in Credential Manager (set-secrets); without them cards
# still appear on Today, silently.
proactive:
  mail_minutes: 10              # mail watch: truly important new mail only; the first run only learns
  quiet_minutes: 20             # nothing for this long after each adhan; held, then sent
city:                           # prayer times (Umm al-Qura), as the app computes them
  name: Jeddah
  latitude: 21.4858
  longitude: 39.1925

# Step 6: Ahmad's memory of Khalid and his family. Each part is its own adapter.
memory:
  provider: store               # facts, family, key dates and the interview, in the store above (memory: tests)
  search: keyword               # keyword search with Arabic normalised first; meaning search (pgvector) later
  gift_ideas: true              # one brain call a week before each birthday (counts toward daily_call_limit)

heartbeat:
  seconds: 15                   # the app shows "PC offline" after 45 seconds

backup:
  folder: D:/Projects/IT Consultant/teams/coordination/snafi-backups   # ignored by Git; no Claude session may read it
  time: "03:30"                 # daily, local time below
  keep_days: 30

time_zone: Asia/Riyadh
