# Bounded bilingual hints; optional structured resolution requires model consent.
# Ahmad (default_agent) consults matched specialists directly and answers strategy,
# roadmap, budget and prioritization requests himself. leader_agent (Abdullah) leads
# only the SOP pipeline and is rejected here.
default_agent: secretary_agent
memory_example_limit: 3
max_specialists: 6
context_max_chars: 16000
negation_terms:
- 'no'
- not
- without
- exclude
- skip
- avoid
- don't
- do not
- بدون
- لا
- ما ابغى
- ما ابي
- لا اريد
- استثني
