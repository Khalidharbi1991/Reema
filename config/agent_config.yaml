# Agent Configuration
# Defines settings for each agent in the multi-agent system

leader_agent:
  name: "Abdullah"
  role: "Coordinates all worker agents and manages workflow"
  model: "claude-sonnet-4"
  max_tokens: 4096
  temperature: 0.7

research_agent:
  name: "Taif"
  role: "Gathers ITIL and IT standards information"
  model: "claude-sonnet-4"
  max_tokens: 4096
  temperature: 0.5
  specialization:
    - "ITIL v4 framework"
    - "IT Service Management"
    - "Industry best practices"
    - "ITOM processes"

standards_agent:
  name: "Mohammad"
  role: "Ensures regulatory and framework alignment"
  model: "claude-sonnet-4"
  max_tokens: 4096
  temperature: 0.3
  specialization:
    - "ITIL v4"
    - "ISO 20000"
    - "ISO 27001"
    - "COBIT"
    - "SOC 2"
    - "Compliance frameworks"

content_agent:
  name: "Saad"
  role: "Creates detailed SOP documentation"
  model: "claude-sonnet-4"
  max_tokens: 8192
  temperature: 0.7
  specialization:
    - "Technical writing"
    - "SOP creation"
    - "Process documentation"
    - "RACI matrices"

review_agent:
  name: "Faisal"
  role: "Validates and ensures content quality"
  model: "claude-sonnet-4"
  max_tokens: 4096
  temperature: 0.3
  quality_threshold: 85
  specialization:
    - "Quality assurance"
    - "ITIL validation"
    - "Technical accuracy"
    - "Standards compliance"

format_agent:
  name: "Bee"
  role: "Converts content to multiple formats"
  supported_formats:
    - "pdf"
    - "docx"
    - "markdown"
    - "html"
  default_formats:
    - "pdf"
    - "docx"
