# Agent Configuration
# Defines settings for each agent in the REEMA multi-agent system
# Agent roles. Human approval is recorded separately; AI roles cannot approve.
# REEMA makes no model call: Claude Code writes the text, so roles carry no model settings.

# --- Personal coordination ---

secretary_agent:
  name: "Ahmad"
  role: "Executive Personal Assistant & Coordinator"
  specialization:
    - "Bilingual Arabic and English conversation"
    - "Email triage and drafting (Gmail, Yahoo; planned in Snafi)"
    - "Calendar, Todoist tasks, reminders and Drive files (planned in Snafi)"
    - "Memory of Khalid's preferences, family and routine"
    - "Proactive briefs"
    - "Family messaging over Telegram, with Khalid's private data never shared (planned in Snafi)"
    - "PRD permission levels: never sends, invites, deletes or pays without approval"
    - "Routing to the Personal, Documentation, Home Design and Development teams and reporting back"
    - "Work and personal task organization"
    - "Daily planning and follow-up"
    - "IT strategy, roadmap and prioritization advice"
    - "Governance, risk escalation and audit readiness for human review"
    - "Quality expectations and acceptance criteria"
    - "Business value, cost-benefit and business-case framing"

# --- SOP pipeline leader (not consulted in chat) ---

leader_agent:
  name: "Abdullah"
  role: "SOP Pipeline Leader & Specialist Orchestrator"
  specialization:
    - "IT strategy and roadmap development"
    - "Portfolio and programme governance"
    - "Business and IT alignment"
    - "Quality expectations and acceptance criteria"
    - "Documentation quality, accuracy, usability, and continuous improvement"
    - "Stakeholder communication and risk escalation"
    - "Executive reporting and client expectation management"
    - "Business value, cost benefit, and return on investment analysis"
    - "Business case development and operational efficiency"
    - "ITIL, COBIT, ISO 20000, and ISO 27001 governance"
    - "Audit readiness and controls assurance for human review"
    - "NCA, SAMA, and PDPL oversight requiring human verification"

research_agent:
  name: "Agent 1"
  role: "Gathers ITIL and IT standards information"
  specialization:
    - "ITIL v4 framework"
    - "IT Service Management"
    - "Industry best practices"
    - "ITOM processes"

standards_agent:
  name: "Agent 2"
  role: "Ensures regulatory and framework alignment"
  specialization:
    - "ITIL v4"
    - "ISO 20000"
    - "ISO 27001"
    - "COBIT"
    - "SOC 2"
    - "Compliance frameworks"

access_agent:
  name: "Agent 6"
  role: "Access Management & IAM Compliance Specialist"
  specialization:
    - "Identity & Access Management (IAM)"
    - "Privileged Access Management (PAM)"
    - "RBAC/ABAC access control models"
    - "Zero Trust Architecture"
    - "Cloud IAM (AWS, Azure, GCP)"
    - "SSO, MFA, FIDO2 authentication"
    - "Access governance and certification"
    - "NCA ECC 2-2, SAMA Domain 3, PDPL"
    - "ISO 27001:2022 access controls"
    - "Access analytics and UEBA"

problem_agent:
  name: "Agent 7"
  role: "Problem Management & RCA Specialist"
  specialization:
    - "ITIL v4 Problem Management"
    - "Root Cause Analysis (RCA)"
    - "Known Error Database (KEDB)"
    - "Proactive Problem Management"
    - "Problem-Incident Integration"
    - "ServiceNow Problem Module"
    - "ISO 20000 Section 8.3"
    - "COBIT DSS03"

data_agent:
  name: "Agent 8"
  role: "Data Analytics & Power BI Specialist"
  specialization:
    - "Data analytics frameworks"
    - "Power BI dashboard design"
    - "KPI visualization"
    - "Data modeling"
    - "Business intelligence"

content_agent:
  name: "Agent 3"
  role: "Creates detailed SOP documentation"
  # Agent 3 writes one section per request, so this caps a section, not the SOP.
  # 16,000 tokens at ~40 tokens/s plus latency fits 480 s, below the SDK's
  # 10-minute non-streaming limit. Other roles keep API_TIMEOUT_SECONDS.
  specialization:
    - "Technical writing"
    - "SOP creation"
    - "Process documentation"
    - "RACI matrices"
    - "draw.io (diagrams.net) flowchart generation"
    - "draw.io XML (.drawio) file creation"
    - "Process flow diagram design"
    - "BPMN 2.0 notation"

review_agent:
  name: "Agent 4"
  role: "Validates and ensures content quality"
  quality_threshold: 85
  specialization:
    - "Quality assurance"
    - "ITIL validation"
    - "Technical accuracy"
    - "Standards compliance"

format_agent:
  name: "Agent 5"
  role: "Converts content to multiple formats"

building_design_agent:
  name: "Agent 9"
  role: "Building 3D Modeling & Interior/Exterior Design Specialist"
  specialization:
    - "Architectural drawing interpretation and modeling briefs"
    - "Building massing, spatial layout, and room planning"
    - "Interior furniture, lighting, and material concepts"
    - "Exterior landscape and facade concepts"
    - "Explicit measurement, level, and design-assumption tracking"
    - "CAD-to-3D preparation; no claim of an editable model until exported and checked"
euc_agent:
  name: "Agent 10"
  role: "End-User Computing & Endpoint Management Specialist"
  specialization:
    - "Patch management, deployment rings, and out-of-band response"
    - "Intune, MECM/SCCM co-management, Autopilot, and Windows Update for Business"
    - "OS image engineering, feature updates, and Windows 11 readiness"
    - "Software packaging and distribution (MSI, MSIX, Win32, PSADT)"
    - "Endpoint compliance, security baselines, BitLocker, and LAPS"
    - "PowerShell and Graph automation drafts with dry-run modes"
    - "ITIL 4 change requests, runbooks, KB articles, and RCA for end-user devices"
    - "Rollback paths, kill switches, and irreversible-action warnings"
